name: Feature request
description: Propose a focused improvement to the core review instrument
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What review job is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change, including CLI and Desk implications where relevant.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Contract or safety impact
      description: Note any API, desk-schema, file-fence, network, or migration implications.
  - type: checkboxes
    id: fit
    attributes:
      label: Product fit
      options:
        - label: This keeps approve distinct from apply and sweep.
          required: true
        - label: This does not require remote or multi-user server behavior.
          required: true
