[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "setsweep"
version = "0.2.0"
description = "A review instrument: agents prepare and propagate; the human reviewer reads and rules. Three-pane app or CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Charles Berret" }]
keywords = ["review", "agents", "claude", "editor", "curation", "inbox"]
dependencies = []                  # the server and the CLI viewport are stdlib-only

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6",
  "pytest>=8",
  "pytest-cov>=5",
]

[project.scripts]
setsweep = "setsweep_main:main"
setsweep-watch = "setsweep_watch:main"   # the inbox folder-watch — run on a schedule (cron/timer)

[tool.setuptools]
# Flat layout: explicit module list disables auto-discovery (which would choke on the
# test_*.py siblings). Install editable (`pip install -e`) so APPDIR resolves to the repo
# and static/ + projects.json are found in place. A non-editable wheel would need the
# tree restructured under a package + package-data for static/ — deferred (see INSTALL.md).
# After adding a name here: reinstall editable (`pip install -e .`) or the finder MAPPING
# goes stale and the CLI raises ModuleNotFoundError for the new module.
py-modules = ["setsweep_main", "setsweep_contract", "server", "runtime", "lineage", "cli", "kits", "curator", "sweepkit", "egress", "survey", "setsweep_watch"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["."]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["test_*.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
