[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kettle"
version = "0.2.0"
description = "A review instrument: agents prepare and propagate; the human reviewer reads and rules. Three-pane app or CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Charles Berret" }]
keywords = ["review", "agents", "claude", "editor", "curation", "inbox"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
]
dependencies = []                  # the server and the CLI viewport are stdlib-only

[project.urls]
Homepage = "https://github.com/charlesberret/kettle"
Repository = "https://github.com/charlesberret/kettle-core"
Issues = "https://github.com/charlesberret/kettle-core/issues"
Changelog = "https://github.com/charlesberret/kettle-core/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6",
  "pytest>=8",
  "pytest-cov>=5",
]

[project.scripts]
kettle = "kettle.kettle_main:main"
kettle-watch = "kettle.kettle_watch:main"   # the inbox folder-watch — run on a schedule (cron/timer)
# Transitional aliases. Keep old installations and automation working while the
# public product moves to Kettle; remove only in a separately announced release.
setsweep = "kettle.kettle_main:main"
setsweep-watch = "kettle.kettle_watch:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["kettle*"]

# Package data: web UI + curator kits + example registry ship inside the wheel.
[tool.setuptools.package-data]
kettle = [
  "static/**/*",
  "kits/**/*",
  "projects.example.json",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["kettle"]
omit = ["tests/*", "tools/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
